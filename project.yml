name: AppGym
options:
  bundleIdPrefix: com.jordiferres
  objectVersion: 56
targets:
  AppGym:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.jordiferres.appgym
    sources:
      - path: App.swift
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
    frameworks:
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: AppGym
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiferres.appgym
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: "minimal"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
