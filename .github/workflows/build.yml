name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deep Clean Runner Disk Space
        run: |
          sudo rm -rf /usr/local/share/android-sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles
          rm -rf ~/Library/Caches/com.apple.dt.XCode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Minimal Disk Footprint)
        run: |
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            -quiet

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/AppGym.app Payload/
          zip -r AppGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGym-Unsigned-IPA
          path: AppGym.ipa
