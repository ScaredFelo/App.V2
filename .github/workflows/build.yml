name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wipe Unused Xcode Versions & Free Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /usr/local/share/android-sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/com.apple.dt.XCode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 2>&1 | tee build.log || (echo "=== DETALLE DE ERRORES ===" && grep -i "error:" build.log && exit 1)

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R /tmp/DerivedData/Build/Products/Release-iphoneos/AppGym.app Payload/
          zip -r AppGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGym-Unsigned-IPA
          path: AppGym.ipa
